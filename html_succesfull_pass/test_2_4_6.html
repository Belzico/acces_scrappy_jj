<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test SC 2.4.6 - Non-Descriptive Headings & Labels</title>
</head>
<body>

  <!-- Headings -->
  <h1>Heading</h1>            <!-- Genérico -->
  <h2> </h2>                  <!-- Vacío -->
  <h3>Our Products</h3>       <!-- Correcto (no error) -->
  <h4>Section</h4>            <!-- Genérico -->

  <!-- Labels -->
  <form>
    <label> </label>          <!-- Vacía -->
    <input type="text" name="field1" />

    <br><br>

    <label>Label</label>      <!-- Genérico -->
    <input type="text" name="field2" />

    <br><br>

    <label>First Name:</label> <!-- Correcto (no error) -->
    <input type="text" name="firstname" />
  </form>

</body>
</html>
